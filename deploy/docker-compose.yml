# Vibe Chat — production stack.
#
# Profiles let the same file run every topology:
#   one server (start here):   docker compose --profile data --profile app up -d --build
#
# Photos (STORAGE_DRIVER=local) are files in the "media" volume: the API and the worker write them,
# nginx serves photos/ and chat/ on MEDIA_DOMAIN. With several app nodes, use Cloudflare R2 instead.
#   data node (DB + Redis):     docker compose --profile data up -d
#   app node (stateless):       docker compose --profile app up -d --build      (DATABASE_URL/REDIS_URL point at the data node)
#
# Scale the API on a node:      docker compose --profile app up -d --scale api=4
# nginx re-resolves "api" through Docker DNS, so every replica gets traffic; Redis Pub/Sub fans
# realtime events out across replicas and across nodes. Add nodes behind the Cloudflare Load Balancer.
name: vibechat

x-server-env: &server_env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:-postgres://vibe:${POSTGRES_PASSWORD}@postgres:5432/vibe}
  REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379}

services:
  # ---------------------------------------------------------------- data profile
  postgres:
    profiles: ["data"]
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: vibe
      POSTGRES_USER: vibe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    # Starting point for an 8 GB data server; scale shared_buffers (~25% RAM) and
    # effective_cache_size (~70% RAM) with the machine.
    command: >
      postgres
      -c max_connections=400
      -c shared_buffers=2GB
      -c effective_cache_size=5GB
      -c work_mem=16MB
      -c maintenance_work_mem=512MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c wal_compression=on
      -c max_wal_size=4GB
      -c checkpoint_completion_target=0.9
      -c autovacuum_vacuum_scale_factor=0.05
      -c autovacuum_max_workers=4
      -c idle_in_transaction_session_timeout=60s
      -c log_min_duration_statement=500
    ports:
      # Only reachable on the private network of your servers (see setup-ubuntu.sh firewall rules).
      - "${DATA_BIND_IP:-127.0.0.1}:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibe -d vibe"]
      interval: 5s
      retries: 20

  redis:
    profiles: ["data"]
    image: redis:7-alpine
    restart: unless-stopped
    # AOF keeps decks/counters/queues across restarts; noeviction because BullMQ must not lose jobs.
    command: >
      redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD} --tcp-backlog 2048
    ports:
      - "${DATA_BIND_IP:-127.0.0.1}:6379:6379"
    volumes:
      - redisdata:/data
    sysctls:
      net.core.somaxconn: 2048
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      retries: 20

  # ---------------------------------------------------------------- app profile (stateless)
  # The photos volume must belong to the user the API runs as (node), whichever container
  # happened to create it first. Runs once per start and exits.
  media-init:
    profiles: ["app"]
    build: ../apps/server
    image: vibechat/server:latest
    pull_policy: build
    user: root
    command: ["chown", "node:node", "/data/media"]
    volumes:
      - media:/data/media
    restart: "no"

  api:
    profiles: ["app"]
    build: ../apps/server
    image: vibechat/server:latest
    # built here, never downloaded (it is not on Docker Hub)
    pull_policy: build
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *server_env
    volumes:
      - media:/data/media
    # on a single server, start after the database and Redis are up (skipped on app-only nodes)
    depends_on:
      postgres: { condition: service_healthy, required: false }
      redis: { condition: service_healthy, required: false }
      media-init: { condition: service_completed_successfully }
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      # migrations run before it listens; failures in this window don't count
      start_period: 90s
      start_interval: 3s

  # Background jobs + outgoing Telegram messages. Run one per node (BullMQ shares the work; the
  # Telegram rate limit is global in Redis, so more workers never exceed it).
  worker:
    profiles: ["app"]
    # the same image as the API (the second build is a cache hit)
    build: ../apps/server
    image: vibechat/server:latest
    pull_policy: build
    restart: unless-stopped
    command: ["node", "dist/src/worker.js"]
    env_file: .env
    environment:
      <<: *server_env
    volumes:
      - media:/data/media
    depends_on:
      api:
        condition: service_healthy

  admin:
    profiles: ["app"]
    build:
      context: ../apps/admin
      args:
        NEXT_PUBLIC_APP_NAME: ${APP_NAME:-Vibe Chat}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:4000
      COOKIE_SECURE: "true"
    depends_on:
      - api

  # TLS (Cloudflare origin certificate) + the Mini App's static files + reverse proxy for API/admin.
  nginx:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
      args:
        VITE_API_URL: https://${API_DOMAIN}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      # photos from the media volume (unused with R2)
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:-media.invalid}
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - media:/srv/media:ro
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    depends_on:
      - api
      - admin

volumes:
  pgdata:
  redisdata:
  media:
