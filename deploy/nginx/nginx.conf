user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
  worker_connections 16384;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 75s;
  keepalive_requests 10000;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml font/ttf;

  # Real client IPs from Cloudflare (only trusted when the request comes from a Cloudflare edge).
  include /etc/nginx/cloudflare.conf;

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent $request_time "$http_user_agent"';
  access_log /var/log/nginx/access.log main buffer=64k flush=5s;

  include /etc/nginx/conf.d/*.conf;
}
